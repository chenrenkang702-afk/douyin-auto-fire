name = "douyin-actions-trigger"
main = "worker.js"
compatibility_date = "2024-09-23"

# 如需防止同一天重复触发，绑定一个 KV：在 Cloudflare 后台创建 KV namespace 后，
# 把下面两行注释去掉，并把 id 换成你的 KV namespace ID
# [[kv_namespaces]]
# binding = "KV"
# id = "你的KV_namespace_ID"

# Cron Trigger：每分钟跑一次（免费额度内足够），由代码判断目标时间
# 注意：Cloudflare Cron 使用的是 UTC 时间表达式，这里用 "* * * * *" 每分钟触发，
# 具体"几点触发"由代码里的 TZ_OFFSET / SCHEDULE_HOUR / SCHEDULE_MIN 控制。
[triggers]
crons = ["* * * * *"]
